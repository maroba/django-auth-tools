[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-auth-tools"
version = "0.1.0"
description = "Some tools for authentication in Django projects"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Matthias Baer", email = "matthias.r.baer@googlemail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    "Django>=4.2",
]

[project.urls]
Homepage = "https://github.com/Matthias Baer/django-auth-tools"
Repository = "https://github.com/Matthias Baer/django-auth-tools"
Issues = "https://github.com/Matthias Baer/django-auth-tools/issues"

[tool.setuptools.packages.find]
include = ["django_auth_tools*"]
